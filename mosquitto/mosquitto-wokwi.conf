# Mosquitto com BRIDGE para o broker público usado pelo ESP32 no Wokwi.
# Ativado por docker-compose.wokwi.yml (ver dispositivos/esp32-wokwi/README.md).

# --- mesma configuração do mosquitto.conf padrão ---
listener 1883
allow_anonymous true
persistence false
log_dest stdout

# --- bridge ---
# O ESP32 no Wokwi só alcança a internet, então publica no broker público com
# um prefixo único. O bridge espelha SÓ os tópicos da M-06, tirando/colocando
# o prefixo: para a plataforma, a M-06 é uma máquina como qualquer outra.
#   remoto: iotpm-d38091/fabrica/maquinas/M-06/telemetria
#   local:                fabrica/maquinas/M-06/telemetria
# O prefixo deve ser IGUAL ao PREFIXO de dispositivos/esp32-wokwi/sketch.ino.
connection wokwi-esp32
address broker.hivemq.com:1883
remote_clientid iotpm-d38091-bridge
bridge_protocol_version mqttv311
try_private false
cleansession true
notifications false
start_type automatic
restart_timeout 5 30

#     padrão                       direção QoS prefixo-local prefixo-remoto
topic maquinas/M-06/telemetria     in  0   fabrica/      iotpm-d38091/fabrica/
topic maquinas/M-06/evento         in  1   fabrica/      iotpm-d38091/fabrica/
topic maquinas/M-06/status         in  1   fabrica/      iotpm-d38091/fabrica/
topic maquinas/M-06/comando        out 1   fabrica/      iotpm-d38091/fabrica/
topic alertas                      out 1   fabrica/      iotpm-d38091/fabrica/
