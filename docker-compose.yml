x-plataforma: &plataforma
  build:
    context: .
    dockerfile: plataforma/Dockerfile
  image: iot-pm-plataforma
  environment:
    MQTT_HOST: mosquitto

# Cada máquina é um dispositivo independente: mesma imagem ("firmware"),
# identidade e conexão MQTT próprias. Para adicionar uma máquina, copie um
# bloco maquina-mXX e troque MAQUINA_ID.
x-maquina: &maquina
  build: ./dispositivos/simulador
  image: iot-pm-maquina
  restart: unless-stopped
  depends_on:
    - mosquitto

x-maquina-env: &maquina-env
  MQTT_HOST: mosquitto

services:
  # ======================= REDE / BROKER =======================
  # Broker MQTT: o "correio" entre o chão de fábrica e a plataforma.
  # Os serviços abaixo usam a rede interna do Docker (mosquitto:1883); a porta
  # publicada no host só serve para dispositivos/ferramentas externas. Se a 1883
  # já estiver em uso (ex.: Mosquitto instalado no Windows), troque com
  # MQTT_PORTA_HOST=1884.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORTA_HOST:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ================= CHÃO DE FÁBRICA (dispositivos/) =================
  # Um container por máquina (mock dos dispositivos IoT, sem código da plataforma).
  # Teste de resiliência: `docker compose stop maquina-m02` desliga só essa máquina.
  maquina-m01:
    <<: *maquina
    environment: { <<: *maquina-env, MAQUINA_ID: M-01, TIPO_PRODUTO: M }

  maquina-m02:
    <<: *maquina
    environment: { <<: *maquina-env, MAQUINA_ID: M-02, TIPO_PRODUTO: L }

  # A máquina que se degrada até falhar (estrela da demonstração)
  maquina-m03:
    <<: *maquina
    environment: { <<: *maquina-env, MAQUINA_ID: M-03, TIPO_PRODUTO: L, DEGRADANDO: "true" }

  maquina-m04:
    <<: *maquina
    environment: { <<: *maquina-env, MAQUINA_ID: M-04, TIPO_PRODUTO: H }

  maquina-m05:
    <<: *maquina
    environment: { <<: *maquina-env, MAQUINA_ID: M-05, TIPO_PRODUTO: M }

  # ======================= PLATAFORMA (plataforma/) =======================
  # Treina o modelo uma vez e termina (se já existir modelos/modelo.joblib, retreina)
  treino:
    <<: *plataforma
    command: python -m plataforma.treino.treinar_modelo
    volumes:
      - ./data:/app/data
      - ./modelos:/app/modelos

  # Ingestão do fluxo MQTT + validação do contrato + inferência da IA + gravação no banco
  inferencia:
    <<: *plataforma
    command: python -m plataforma.inferencia.servico
    volumes:
      - ./modelos:/app/modelos
      - runtime:/app/runtime
    depends_on:
      mosquitto:
        condition: service_started
      treino:
        condition: service_completed_successfully

  # Painel web em http://localhost:8501 (porta configurável com PAINEL_PORTA_HOST)
  painel:
    <<: *plataforma
    command: streamlit run plataforma/painel/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${PAINEL_PORTA_HOST:-8501}:8501"
    volumes:
      - runtime:/app/runtime
    depends_on:
      - inferencia

volumes:
  runtime:
