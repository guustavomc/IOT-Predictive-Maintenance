x-plataforma: &plataforma
  build:
    context: .
    dockerfile: plataforma/Dockerfile
  image: iot-pm-plataforma
  environment:
    MQTT_HOST: mosquitto

services:
  # ======================= REDE / BROKER =======================
  # Broker MQTT: o "correio" entre o chão de fábrica e a plataforma.
  # Os serviços abaixo usam a rede interna do Docker (mosquitto:1883); a porta
  # publicada no host só serve para dispositivos/ferramentas externas. Se a 1883
  # já estiver em uso (ex.: Mosquitto instalado no Windows), troque com
  # MQTT_PORTA_HOST=1884.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORTA_HOST:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ================= CHÃO DE FÁBRICA (dispositivos/) =================
  # Mock dos dispositivos IoT: imagem própria, sem nenhum código da plataforma.
  simulador:
    build: ./dispositivos/simulador
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto

  # ======================= PLATAFORMA (plataforma/) =======================
  # Treina o modelo uma vez e termina (se já existir modelos/modelo.joblib, retreina)
  treino:
    <<: *plataforma
    command: python -m plataforma.treino.treinar_modelo
    volumes:
      - ./data:/app/data
      - ./modelos:/app/modelos

  # Ingestão do fluxo MQTT + validação do contrato + inferência da IA + gravação no banco
  inferencia:
    <<: *plataforma
    command: python -m plataforma.inferencia.servico
    volumes:
      - ./modelos:/app/modelos
      - runtime:/app/runtime
    depends_on:
      mosquitto:
        condition: service_started
      treino:
        condition: service_completed_successfully

  # Painel web em http://localhost:8501 (porta configurável com PAINEL_PORTA_HOST)
  painel:
    <<: *plataforma
    command: streamlit run plataforma/painel/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${PAINEL_PORTA_HOST:-8501}:8501"
    volumes:
      - runtime:/app/runtime
    depends_on:
      - inferencia

volumes:
  runtime:
